[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerreviewagents"
version = "0.9.0"
description = "Evidence-linked peer review of a manuscript PDF, on a coding-agent subscription"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" },
    { name = "Ricard Garcia-Carbonell" },
    { name = "Aleix Navarro Garrido" },
    { name = "John R. Yates III", email = "jyates@scripps.edu" },
]
maintainers = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" },
]
keywords = [
    "peer-review",
    "llm",
    "multi-agent",
    "scholarly-publishing",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "tomli>=2; python_version < '3.11'",
    # The plugin's own MCP server, which owns identity, the ledger and the run
    # files, is `python -m peerreviewagents.plugin.server` and Claude Code
    # launches it from this environment. A review cannot start without the SDK,
    # so it is a dependency and not an extra: 0.8 kept it optional because the
    # review itself ran in Python and the MCP transport was one surface over it.
    "mcp>=1.13,<2",
    # Reads PDFs into source blocks. Required, not optional: PDF ingest has no
    # fallback, because the one it used to have fused words across column
    # boundaries and flattened every heading — see the README's ingest section.
    # 0.2 is where the converter reports the document's own section tree and
    # typed bibliography; the loader feature-detects and still runs on 0.1.x,
    # but a fresh install should get the version whose sections are read, not
    # guessed.
    #
    # Pinned exactly: peerreviewagents.engine records the converter version in
    # every run manifest and compares it when resuming, so a floating minor
    # would invalidate in-flight runs.
    "rustypaper==0.2.2",
    # peerreviewagents.engine runtime: Pillow renders the page images the
    # importer attaches to a review.
    "Pillow>=10",
]

[project.optional-dependencies]
# `dev` runs the whole suite on its own. pyyaml is transitive today, but
# tests/test_metadata.py parses CITATION.cff directly — declare it so CI
# cannot lose it to a dependency change.
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/pgarrett-scripps/PeerReviewAgents"
# The Zenodo concept DOI, which always resolves to the newest release.
DOI = "https://doi.org/10.5281/zenodo.21781895"
Repository = "https://github.com/pgarrett-scripps/PeerReviewAgents"
Issues = "https://github.com/pgarrett-scripps/PeerReviewAgents/issues"

[project.scripts]
peerreview = "peerreviewagents.cli.main:run"

[tool.ruff]
# Pinned explicitly: ruff's default rule selection widens between releases, so
# without this a version bump silently changes what CI accepts.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# peerreviewagents.engine and its tests came over from paper-workbench in
# 0.7.0. Their house style is dense one-line bodies (`if x:return y`) and
# unsorted import blocks, which trip E701 and I001 on nearly every module.
# Reflowing ~160 lines of a reviewed engine would hide real changes in future
# diffs against upstream, so the two formatting rules are off for that tree.
# Everything else, including the F rules that catch dead code, still applies.
[tool.ruff.lint.per-file-ignores]
"peerreviewagents/engine/*" = ["E701", "I001"]
"tests/engine/*" = ["E701", "I001"]

[tool.setuptools.packages.find]
include = ["peerreviewagents*"]

[tool.setuptools.package-data]
# The engine reads its domain packs from the installed package, so the
# manifests, reviewer skills, and fixture cases have to ship in the wheel.
"peerreviewagents.engine" = [
    "README.md",
    "domains/*/manifest.json",
    "domains/*/skills/*/SKILL.md",
    "domains/*/fixtures/cases.json",
]
