[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerreviewagents"
version = "0.1.0"
description = "Multi-agent LLM peer-review framework (an editorial board for manuscripts)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" },
]
keywords = [
    "peer-review",
    "llm",
    "multi-agent",
    "langgraph",
    "scholarly-publishing",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "textual>=0.60",
    "rich>=13",
    "pydantic>=2",
    "python-dotenv>=1",
    "tomli>=2; python_version < '3.11'",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "pypdf>=4",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
research = ["arxiv>=2", "requests>=2"]
web-test = ["httpx>=0.27"]
# Evaluation harness: fetch a labeled OpenReview corpus and score the
# pipeline against human reviews. Stats are pure-Python (no scipy);
# matplotlib is only used to render the paper figure (committed as SVG, so
# the Typst paper build itself needs no Python).
eval = ["openreview-py>=1.40", "matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/pgarrett-scripps/PeerReviewAgents"
Repository = "https://github.com/pgarrett-scripps/PeerReviewAgents"
Issues = "https://github.com/pgarrett-scripps/PeerReviewAgents/issues"

[project.scripts]
peerreview = "cli.main:run"

[tool.ruff]
# Pinned explicitly: ruff's default rule selection widens between releases, so
# without this a version bump silently changes what CI accepts.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["peerreviewagents*", "cli*"]

[tool.setuptools.package-data]
"peerreviewagents.journals" = ["*.toml", "README.md"]
"peerreviewagents.web" = ["static/*"]
