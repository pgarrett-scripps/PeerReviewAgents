[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerreviewagents"
version = "0.1.0"
description = "Multi-agent LLM peer-review framework (an editorial board for manuscripts)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "textual>=0.60",
    "rich>=13",
    "pydantic>=2",
    "python-dotenv>=1",
    "tomli>=2; python_version < '3.11'",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12",
]

[project.optional-dependencies]
research = ["arxiv>=2", "requests>=2"]
pdf-ingest = ["requests>=2", "Pillow>=10"]
web-test = ["httpx>=0.27"]

[project.scripts]
peerreview = "cli.main:run"

[tool.setuptools]
packages = ["peerreviewagents", "cli"]

[tool.setuptools.package-dir]
peerreviewagents = "peerreviewagents"
cli = "cli"
