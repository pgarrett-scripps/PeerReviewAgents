# Journal profile template. Copy to <slug>.toml and fill in what you know.
# Only `name` is required; leave unknown fields unset rather than guessing.
# See README.md for field meanings.

name = ""                  # exact venue name, e.g. "Nature Methods"
aliases = []               # ["Nat. Methods"]
publisher = ""             # publisher / society
field = ""                 # primary discipline, e.g. "bioinformatics"

# --- Reputation (record the year; these drift) ---
impact_factor = 0.0
impact_factor_year = 2025
acceptance_rate = ""       # e.g. "~8%"

# --- Audience & scope ---
audience = ""
description = ""           # 1-3 sentences on what the journal publishes
scope = ""                 # what is in / out of scope

# --- Submission limits (0 or unset = no hard limit) ---
max_words = 0
abstract_max_words = 0
max_figures = 0
max_references = 0

# --- Free-text author/reviewer guidance ---
guidelines = """
Evaluation criteria, required manuscript structure, data/code availability
policy, statistics/reporting standards, and anything reviewers should weigh.
"""

last_updated = "2026-06-01"
