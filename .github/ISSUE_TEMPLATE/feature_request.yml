name: Feature request
description: A new agent, server tool, workflow arm, or capability.
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of addition?
      options:
        - New reviewer / specialist agent
        - New server tool
        - New workflow arm
        - Workflow or editor change
        - Manuscript import or report change
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        What does the pipeline currently get wrong or miss? Concrete beats
        abstract — a manuscript it misjudged is more useful than a category.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: |
        For a new agent, which tools would it be allowed and where would it sit
        in `workflows/review.js`? For a new tool, what would the server check
        before trusting what comes back? See CONTRIBUTING.md for the shape.
    validations:
      required: false
