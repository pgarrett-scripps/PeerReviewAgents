name: Bug report
description: Something in the pipeline misbehaves.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        The exact command. Please don't attach an unpublished manuscript — a
        description of its shape (page count, sections present, whether it has
        publisher XML) is usually enough.
      render: shell
      placeholder: peerreview paper.pdf --mode ensemble --reviewers 2
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Transport and model
      description: The subscription the run used, from `--provider` and `--model`.
      placeholder: claude-code / claude-sonnet-5-5
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "`pip show peerreviewagents | grep Version`, or the commit SHA."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Traceback or relevant output
      description: Scrub any tokens or paths you would rather not publish before pasting.
      render: shell
    validations:
      required: false
