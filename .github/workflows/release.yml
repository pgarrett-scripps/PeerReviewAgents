name: Release

# Publishes the package to PyPI, from a tag.
#
# The tag is the trigger and the version is read from pyproject.toml, so the
# two can disagree — and a release published under the wrong number cannot be
# unpublished, only yanked. The first job compares them and stops.
#
# Pure Python, so there is one wheel and no build matrix. The extension work
# lives in rustypaper, which ships its own wheels from its own repo; here it
# is an ordinary dependency resolved from PyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify the tag and metadata
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - id: version
        run: |
          version=$(python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match pyproject.toml version $version."\
                   "A release cannot be unpublished, so this stops here."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${{ inputs.dry_run == false }}" >> "$GITHUB_OUTPUT"
          fi

      # The suite ingests a PDF fixture, and PDF text extraction is Poppler's
      # `pdftotext` — a runtime requirement of the tool itself.
      - name: Install Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install
        run: pip install --quiet -e '.[dev]'

      # CI already runs this on every push to main, but a tag can point at a
      # commit CI never saw — and this is the run that becomes permanent.
      # Metadata tests keep CFF aligned with the package and prevent a static
      # Zenodo version from overriding the release tag.
      - name: Test
        run: pytest tests/ -q

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet build twine

      - run: python -m build

      # Catches the failures PyPI rejects on upload — an unrenderable README
      # or missing metadata — while there is still something to do about it.
      - run: twine check --strict dist/*

      # A wheel that builds is not a wheel that imports: setuptools' package
      # discovery is configured by hand in pyproject.toml, so a new top-level
      # directory can be left out of the distribution without any error here.
      #
      # `-I` is what makes it the wheel alone: every step here runs with the
      # checkout as its working directory, and `python -c` puts that directory
      # on `sys.path` ahead of the venv, so without it these steps import the
      # source tree beside them and pass for a wheel that ships nothing.
      - name: Import what was built, from the wheel alone
        run: |
          python -m venv /tmp/fresh
          wheel=$(find dist -name '*.whl' -print -quit)
          /tmp/fresh/bin/pip install --quiet "${wheel}"
          /tmp/fresh/bin/python -I -c "
          import peerreviewagents, peerreviewagents.cli.main
          import peerreviewagents.plugin.server, peerreviewagents.plugin.starter
          import peerreviewagents.plugin.orchestrator, peerreviewagents.plugin.service
          import peerreviewagents.plugin.runner, peerreviewagents.plugin.claude_code
          print('import ok:', peerreviewagents.__name__)
          "
          /tmp/fresh/bin/peerreview --help >/dev/null

      # A review is the agent definitions plus the skills that start one, and
      # both ship as globbed package data: a file the glob misses is absent
      # with nothing said about it, and `--help` never touches either. So this
      # asks the package where they are and then looks.
      #
      # Every file is named rather than counted. A count is the one check that
      # cannot tell a missing file from a new one: the count this used to
      # assert failed the 0.9.0 release over `citation-worker.md`, which was
      # the new agent working as intended.
      - name: Prove the installed wheel ships its agents and its skills
        run: |
          /tmp/fresh/bin/python -I -c "
          import sysconfig
          from peerreviewagents import agents as pack
          from peerreviewagents.plugin import starter
          site = sysconfig.get_paths()['purelib']
          # Both have to be the installed copies. Without this the step can
          # pass on the checkout sitting in the working directory and say
          # nothing about what was built.
          assert str(pack.HERE).startswith(site), f'{pack.HERE} is not under {site}'
          wanted = (
              'citation-worker', 'citations', 'code', 'code-check', 'core-reviewer',
              'editor', 'field', 'figures-tables', 'fix-check', 'methods-reporting',
              'numbers', 'reader', 'stats',
          )
          absent = [name for name in wanted if not pack.path(name).is_file()]
          assert not absent, f'the installed wheel ships no definition for {absent}'
          # Shipped is not the same as readable: a definition is a header the
          # runner parses and the instruction text it hands the agent.
          for name in wanted:
              held = pack.definition(name)
              assert held.instructions and held.tools, f'{name} is empty'
          plugin = starter.plugin_dir()
          assert str(plugin).startswith(site), f'{plugin} is not under {site}'
          required = [
              '.claude-plugin/plugin.json', 'README.md',
              'skills/peer-review-manuscript/SKILL.md',
              'skills/check-draft/SKILL.md',
              'skills/check-fixes/SKILL.md',
          ]
          missing = [name for name in required if not (plugin / name).is_file()]
          assert not missing, f'the installed plugin is incomplete: {missing}'
          # The skills start a review by running the command this wheel put on
          # PATH. A skill naming a checkout, an interpreter or the deleted
          # stdio server would fail in exactly the place nobody is watching.
          for name in required:
              if not name.startswith('skills/'):
                  continue
              text = (plugin / name).read_text(encoding='utf-8')
              assert 'peerreview ' in text, f'{name} never runs the command'
              for stale in ('peerreview-plugin-server', '.mcp.json', 'workflows/'):
                  assert stale not in text, f'{name} still mentions {stale}'
          print('ok:', len(wanted), 'agents under', pack.HERE)
          print('ok:', len(required), 'plugin files under', plugin)
          "
          # Nothing else is on PATH: the tool server used to be a second
          # console script and a run serves its own tools in process now.
          test ! -e /tmp/fresh/bin/peerreview-plugin-server

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi:
    name: PyPI
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI accepts a short-lived OIDC token from this
      # workflow instead of an API token stored here. The publisher is
      # configured at pypi.org/manage/account/publishing/ and its four claims
      # must match exactly — owner, repository, workflow filename, and the
      # environment named above. A mismatch on any one of them fails as
      # `invalid-publisher`, which reads like a missing publisher rather than
      # a disagreeing one.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: [verify, build, pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "PeerReviewAgents $version"
          fi
