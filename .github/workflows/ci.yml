name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.10,<3.14"
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install --quiet -e '.[dev]'

      # A review runs in a headless Claude Code session on a subscription
      # login, which CI has none of: the suite stubs the `claude` CLI and makes
      # no model call and no network call. If this ever starts needing a
      # secret, something has leaked into the test path.
      - name: Test
        run: pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet -e '.[dev]'

      - run: ruff check .

      # `ruff format --check` is deliberately not enforced. The codebase is
      # hand-formatted in places the formatter would flatten (aligned literal
      # tables, grouped kwargs), and adopting it would reformat most of the
      # tree in one mechanical diff. If you want it, run `ruff format .` as
      # its own commit and add the check back here.

  portability:
    name: Suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -e '.[dev]'
      # The starter builds a `claude` command line and the server writes the
      # run folder, so path handling is what differs off Linux. The whole
      # suite is offline, so there is no reason to run less of it here.
      - run: pytest tests/ -q
