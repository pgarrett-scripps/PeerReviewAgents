guidelines = """
Apply the standards a strong general-interest journal in the field would use.
Reviewers should weigh:
- Soundness and rigor of the methods, analysis, and statistics.
- Whether the conclusions are fully supported by the evidence presented.
- Novelty and significance relative to the existing literature.
- Clarity, completeness, and honest discussion of limitations.
- Reproducibility: availability of data, code, and enough methodological
  detail to repeat the work.
- Research ethics and appropriate reporting/consent where relevant.

Do not penalize the manuscript for failing rules that are specific to a
particular journal (exact word counts, figure caps, house formatting); judge
length and presentation for appropriateness instead. If the authors target a
specific venue, select that journal's profile for venue-specific standards.
"""

