guidelines = """
Reviewers should weigh: novelty and significance for drug discovery; rigor of
biological assays (dose-response, controls, selectivity); quality of SAR; and
full chemical characterization and purity (typically >=95%).

Required: complete synthetic procedures, characterization, and purity data in
Supporting Information; assay protocols; for computational work, experimental
validation. PAINS/assay-interference liabilities should be addressed.
"""

