guidelines = """
Reviewers should weigh BOTH significance/general interest AND technical rigor:
is the advance real and broadly important, and is every central claim supported
by the data with appropriate controls, statistics, and reproducibility?

Required: full data availability (public repository or justified exception);
complete methods and statistics; ethics/consent statements where applicable; and
clear articulation of what is genuinely new. Overclaiming and thin controls are
grounds for major revision.
"""

