"""

scope = """
In scope: novel ML methods with theoretical grounding and/or thorough empirical
evaluation, learning theory, and open-source ML software (MLOSS track). Out of
scope: incremental benchmark-chasing without insight, application papers without
a methodological or theoretical contribution, and work without reproducible
experiments.
"""

