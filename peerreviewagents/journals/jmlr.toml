guidelines = """
Reviewers should weigh:
- Correctness and clarity of the technical contribution (proofs, derivations).
- Significance and novelty relative to prior work, with honest positioning.
- Empirical rigor: appropriate baselines, multiple datasets/seeds, ablations,
  reported variance, and statistical significance of claimed gains.
- Reproducibility: code and experimental details sufficient to reproduce.

JMLR favors depth over brevity — there is no page limit, but length should be
justified by the contribution. For MLOSS submissions the released software,
documentation, and open license are the primary objects of review.
"""

