audience = "Specialists and adjacent fields; significance should matter to a subfield, not necessarily all of science."

description = """
Open-access multidisciplinary journal publishing high-quality research across
the natural sciences. Bar is significant advance within a field rather than the
broad general-interest threshold of Nature.
"""

scope = """
In scope: solid, important advances of interest to specialists in a discipline.
Out of scope: incremental work, or studies whose conclusions outrun the
evidence.
"""

