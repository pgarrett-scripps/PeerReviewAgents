guidelines = """
Reviewers should weigh: novelty and importance within the relevant field;
completeness and rigor of the evidence; and reproducibility. Less emphasis on
broad cross-field interest than Nature, more on solidity.

Required: Reporting Summary, data and code availability, full methods, complete
statistics. Source data for figures is encouraged.
"""

