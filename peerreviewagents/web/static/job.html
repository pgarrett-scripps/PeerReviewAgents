<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PeerReviewAgents — review</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="job-page">
    <header class="topbar">
        <a class="brand" href="/">PeerReviewAgents</a>
        <span id="manuscript-name" class="muted"></span>
        <span class="spacer"></span>
        <span id="job-cost" class="cost">$0.00</span>
        <span id="job-status" class="pill pill-pending">pending</span>
    </header>

    <main class="stage">
        <section id="room" class="room"></section>
        <aside id="panel" class="panel panel-collapsed">
            <header class="panel-head">
                <span id="panel-emoji" class="panel-emoji">·</span>
                <h2 id="panel-title">Click an agent</h2>
                <button id="panel-close" class="panel-close" aria-label="close">✕</button>
            </header>
            <div id="panel-meta" class="panel-meta"></div>
            <div id="panel-body" class="panel-body markdown">
                <p class="muted">Pick a desk to peek at what that reviewer is writing.</p>
            </div>
        </aside>
    </main>

    <section id="banner" class="banner" hidden>
        <h2 id="banner-title">Decision</h2>
        <p id="banner-sub" class="muted"></p>
        <ul id="banner-links"></ul>
    </section>

    <script>
        // Read job id from query string before loading the module.
        window.__JOB_ID = new URLSearchParams(location.search).get('id');
    </script>
    <script type="module" src="/static/app.js"></script>
    <script type="application/javascript"
            src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
