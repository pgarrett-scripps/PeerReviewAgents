<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review — PeerReviewAgents</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1><a href="/">PeerReviewAgents</a></h1>
    <p class="lede" id="subject">Loading the review…</p>
  </header>

  <main>
    <section class="card" id="status-card">
      <h2>Status</h2>
      <dl class="status" id="status"></dl>
      <p class="error" id="status-error" hidden></p>
      <button type="button" id="cancel" hidden>Cancel</button>
    </section>

    <section class="card">
      <h2>REVIEW.md</h2>
      <p class="note" id="report-note">Waiting for the run to report.</p>
      <article class="report" id="report"></article>
    </section>

    <section class="card" id="artifact-card" hidden>
      <h2>Saved run files</h2>
      <ul class="runs" id="artifacts"></ul>
    </section>
  </main>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
