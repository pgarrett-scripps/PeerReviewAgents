<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PeerReviewAgents</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body class="upload-page">
    <main class="upload-card">
        <p class="upload-eyebrow">Automated Peer Review</p>
        <h1>Peer<b>Review</b>Agents</h1>
        <p class="lede">
            Drop a manuscript and convene a chamber of AI reviewers —
            they read, debate, and rule while you watch.
        </p>

        <form id="upload-form" enctype="multipart/form-data">
            <label class="drop-zone" id="drop-zone">
                <input type="file" id="file-input" name="manuscript"
                       accept=".pdf,.md,.markdown,.tex,.docx,.txt" hidden>
                <span class="drop-prompt">
                    <strong>Drop a manuscript here</strong>
                    <span class="muted">PDF · Markdown · LaTeX · DOCX · TXT</span>
                </span>
                <span class="drop-filename" hidden></span>
            </label>
            <label class="journal-field">
                <span class="journal-label">Supplementary information <span class="muted">(optional)</span></span>
                <input type="file" id="si-input" name="supplement"
                       accept=".pdf,.md,.markdown,.tex,.docx,.txt">
                <span class="muted">Passed in full to the methods-completeness auditor.</span>
            </label>
            <label class="journal-field">
                <span class="journal-label">Target journal <span class="muted">(optional)</span></span>
                <select id="journal-select" name="target_journal">
                    <option value="">— Venue-agnostic review —</option>
                </select>
            </label>
            <label class="journal-field">
                <span class="journal-label">Manuscript type <span class="muted">(optional)</span></span>
                <select id="article-type-select" name="article_type">
                    <option value="">— No manuscript-type framing —</option>
                </select>
            </label>
            <label class="strictness-field">
                <span class="journal-label">Review strictness:
                    <strong id="strictness-value">Balanced</strong></span>
                <input type="range" id="strictness-input" name="review_strictness"
                       min="1" max="5" step="1" value="3">
                <span class="strictness-scale muted">
                    <span>Lenient</span><span>Harsh</span>
                </span>
            </label>
            <label class="desk-screen-field">
                <input type="checkbox" id="desk-screen-input" name="desk_screen">
                <span>Desk-screen first
                    <span class="muted">— triage that can reject before full review</span></span>
            </label>
            <label class="desk-screen-field">
                <input type="checkbox" id="memory-input" name="use_memory" checked>
                <span>Long-term memory
                    <span class="muted">— condition the area chair on lessons from past reviews</span></span>
            </label>
            <button type="submit" class="primary" id="submit-btn" disabled>
                Start review
            </button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <section class="history" id="history" hidden>
        <div class="history-head">
            <h2>Recent reviews</h2>
            <span class="muted" id="history-count"></span>
        </div>
        <ul class="history-list" id="history-list"></ul>
    </section>

    <script>
        // Recent-reviews list — disk-backed, so it survives server restarts.
        (async () => {
            const esc = (s) => String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            try {
                const resp = await fetch('/history');
                if (!resp.ok) return;
                const { runs } = await resp.json();
                if (!runs || !runs.length) return;
                const list = document.getElementById('history-list');
                document.getElementById('history-count').textContent =
                    `${runs.length} run${runs.length === 1 ? '' : 's'}`;
                for (const r of runs) {
                    const dec = ['accept','minor','major','reject'].includes(r.decision) ? r.decision : '';
                    const meta = [r.venue, r.date].filter(Boolean).join(' · ');
                    const li = document.createElement('li');
                    li.innerHTML =
                        `<a class="history-link" href="/review.html?run=${encodeURIComponent(r.id)}">` +
                        `<span class="decision-tag ${dec}">${esc(r.decision_label || r.decision || '—')}</span>` +
                        `<span class="history-main">` +
                        `<span class="history-title">${esc(r.title || r.id)}</span>` +
                        `<span class="history-meta">${esc(meta)}</span>` +
                        `</span><span class="history-arrow" aria-hidden="true">→</span></a>`;
                    list.appendChild(li);
                }
                document.getElementById('history').hidden = false;
            } catch (_) { /* no history section if the fetch fails */ }
        })();
    </script>

    <script>
        const form  = document.getElementById('upload-form');
        const input = document.getElementById('file-input');
        const siInput = document.getElementById('si-input');
        const zone  = document.getElementById('drop-zone');
        const sub   = document.getElementById('submit-btn');
        const stat  = document.getElementById('status');
        const fname = zone.querySelector('.drop-filename');
        const prompt = zone.querySelector('.drop-prompt');
        const journalSelect = document.getElementById('journal-select');
        const articleTypeSelect = document.getElementById('article-type-select');
        const strictInput = document.getElementById('strictness-input');
        const strictValue = document.getElementById('strictness-value');
        const deskInput = document.getElementById('desk-screen-input');
        const memInput = document.getElementById('memory-input');

        let strictnessLabels = {
            1: 'Very lenient', 2: 'Lenient', 3: 'Balanced',
            4: 'Strict', 5: 'Very strict',
        };
        function renderStrictness() {
            strictValue.textContent = strictnessLabels[strictInput.value] || '';
        }
        strictInput.addEventListener('input', renderStrictness);
        renderStrictness();

        // Populate the target-journal dropdown + strictness default from the server.
        (async () => {
            try {
                const resp = await fetch('/journals');
                if (!resp.ok) return;
                const data = await resp.json();
                const { journals, default: dflt } = data;
                for (const j of journals) {
                    const opt = document.createElement('option');
                    opt.value = j.slug;
                    let text = j.field ? `${j.name} — ${j.field}` : j.name;
                    if (j.slug === dflt) text += ' (default)';
                    opt.textContent = text;
                    if (j.slug === dflt) opt.selected = true;
                    journalSelect.appendChild(opt);
                }
                // Manuscript types are venue-general; per-type word limits
                // come from whichever journal is also selected.
                const atDflt = data.default_article_type || '';
                for (const at of (data.article_types || [])) {
                    const opt = document.createElement('option');
                    opt.value = at.key;
                    opt.textContent = at.name;
                    if (at.description) opt.title = at.description;
                    if (at.key === atDflt) opt.selected = true;
                    articleTypeSelect.appendChild(opt);
                }
                if (data.strictness_labels) strictnessLabels = data.strictness_labels;
                if (data.default_strictness) strictInput.value = data.default_strictness;
                if (data.default_desk_screen) deskInput.checked = true;
                if (typeof data.default_use_memory === 'boolean') memInput.checked = data.default_use_memory;
                renderStrictness();
            } catch (_) { /* dropdown stays venue-agnostic only */ }
        })();

        function setFile(file) {
            if (!file) return;
            fname.textContent = file.name;
            fname.hidden = false;
            prompt.hidden = true;
            sub.disabled = false;
        }

        input.addEventListener('change', () => setFile(input.files[0]));
        zone.addEventListener('dragover', (e) => {
            e.preventDefault(); zone.classList.add('drag-over');
        });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            const f = e.dataTransfer.files[0];
            if (f) {
                const dt = new DataTransfer();
                dt.items.add(f);
                input.files = dt.files;
                setFile(f);
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!input.files[0]) return;
            sub.disabled = true;
            stat.textContent = 'Uploading…';

            const data = new FormData();
            data.append('manuscript', input.files[0]);
            if (siInput.files[0]) data.append('supplement', siInput.files[0]);
            data.append('target_journal', journalSelect.value);
            data.append('article_type', articleTypeSelect.value);
            data.append('review_strictness', strictInput.value);
            data.append('desk_screen', deskInput.checked ? 'true' : 'false');
            data.append('use_memory', memInput.checked ? 'true' : 'false');
            const resp = await fetch('/jobs', { method: 'POST', body: data });
            if (!resp.ok) {
                stat.textContent = `Error: ${await resp.text()}`;
                sub.disabled = false;
                return;
            }
            const body = await resp.json();
            window.location.href = `/job.html?id=${encodeURIComponent(body.job_id)}`;
        });
    </script>
</body>
</html>
