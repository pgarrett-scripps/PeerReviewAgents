<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PeerReviewAgents</title>
    <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body class="upload-page">
    <main class="upload-card">
        <h1>PeerReviewAgents</h1>
        <p class="lede">
            Drop a manuscript and watch a roomful of AI reviewers tear into it.
        </p>

        <form id="upload-form" enctype="multipart/form-data">
            <label class="drop-zone" id="drop-zone">
                <input type="file" id="file-input" name="manuscript"
                       accept=".pdf,.md,.markdown,.tex,.docx,.txt" hidden>
                <span class="drop-prompt">
                    <strong>Drop a manuscript here</strong>
                    <span class="muted">PDF · Markdown · LaTeX · DOCX · TXT</span>
                </span>
                <span class="drop-filename" hidden></span>
            </label>
            <label class="journal-field">
                <span class="journal-label">Target journal <span class="muted">(optional)</span></span>
                <select id="journal-select" name="target_journal">
                    <option value="">— Venue-agnostic review —</option>
                </select>
            </label>
            <button type="submit" class="primary" id="submit-btn" disabled>
                Start review
            </button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script>
        const form  = document.getElementById('upload-form');
        const input = document.getElementById('file-input');
        const zone  = document.getElementById('drop-zone');
        const sub   = document.getElementById('submit-btn');
        const stat  = document.getElementById('status');
        const fname = zone.querySelector('.drop-filename');
        const prompt = zone.querySelector('.drop-prompt');
        const journalSelect = document.getElementById('journal-select');

        // Populate the target-journal dropdown from the server.
        (async () => {
            try {
                const resp = await fetch('/journals');
                if (!resp.ok) return;
                const { journals, default: dflt } = await resp.json();
                for (const j of journals) {
                    const opt = document.createElement('option');
                    opt.value = j.slug;
                    let text = j.field ? `${j.name} — ${j.field}` : j.name;
                    if (j.slug === dflt) text += ' (default)';
                    opt.textContent = text;
                    if (j.slug === dflt) opt.selected = true;
                    journalSelect.appendChild(opt);
                }
            } catch (_) { /* dropdown stays venue-agnostic only */ }
        })();

        function setFile(file) {
            if (!file) return;
            fname.textContent = file.name;
            fname.hidden = false;
            prompt.hidden = true;
            sub.disabled = false;
        }

        input.addEventListener('change', () => setFile(input.files[0]));
        zone.addEventListener('dragover', (e) => {
            e.preventDefault(); zone.classList.add('drag-over');
        });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            const f = e.dataTransfer.files[0];
            if (f) {
                const dt = new DataTransfer();
                dt.items.add(f);
                input.files = dt.files;
                setFile(f);
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!input.files[0]) return;
            sub.disabled = true;
            stat.textContent = 'Uploading…';

            const data = new FormData();
            data.append('manuscript', input.files[0]);
            data.append('target_journal', journalSelect.value);
            const resp = await fetch('/jobs', { method: 'POST', body: data });
            if (!resp.ok) {
                stat.textContent = `Error: ${await resp.text()}`;
                sub.disabled = false;
                return;
            }
            const body = await resp.json();
            window.location.href = `/job.html?id=${encodeURIComponent(body.job_id)}`;
        });
    </script>
</body>
</html>
